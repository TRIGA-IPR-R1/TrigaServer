# Minimal Apache instance for TrigaServer HTML documentation.
# Used only by trigaserver-doc.service (port 8080).

ServerName trigaserver-doc
ServerRoot /etc/trigaserver
DefaultRuntimeDir /run/trigaserver-doc
PidFile /run/trigaserver-doc/apache2.pid
Mutex file:/run/trigaserver-doc default

User www-data
Group www-data

Listen 8080

# unixd and log_config are compiled into Debian's apache2-bin.
LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule alias_module /usr/lib/apache2/modules/mod_alias.so

TypesConfig /etc/mime.types
AddDefaultCharset UTF-8
DirectoryIndex index.html

DocumentRoot /usr/share/doc/trigaserver/html

<Directory /usr/share/doc/trigaserver/html>
	Options FollowSymLinks
	AllowOverride None
	Require all granted
</Directory>

# dh_sphinxdoc may replace some _static files with symlinks into here.
<Directory /usr/share/javascript>
	Options FollowSymLinks
	Require all granted
</Directory>

ErrorLog /var/log/trigaserver-doc/error.log
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /var/log/trigaserver-doc/access.log common
